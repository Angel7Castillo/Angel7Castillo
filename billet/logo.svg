<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kineticTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
    <linearGradient id="kineticBotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>
    <filter id="kineticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Obsidian Squircle -->
  <rect width="100" height="100" rx="24" fill="#07070B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  
  <!-- Stylized Billet 'B' Double Loops -->
  <g filter="url(#kineticGlow)">
    <path d="M28 22 h26 a18 18 0 0 1 0 36 H28 Z" fill="none" stroke="url(#kineticTopGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 42 h28 a18 18 0 0 1 0 36 H28 Z" fill="none" stroke="url(#kineticBotGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
